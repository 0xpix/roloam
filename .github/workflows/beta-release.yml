name: Beta Release

on:
  push:
    branches:
      - "release/beta"
    tags:
      - "v*-beta"
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Read beta version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < BETA_VERSION)"
          test -n "$VERSION"
          BASE="${VERSION%%-beta*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build beta APK
        run: >
          gradle :app:assembleBeta --no-daemon
          -Pandroid.injected.version.name=${{ steps.version.outputs.base }}
          -Pandroid.injected.version.code=${{ steps.version.outputs.code }}

      - name: Verify beta version
        shell: bash
        run: |
          VERSION="$(apkanalyzer manifest version-name app/build/outputs/apk/beta/app-beta.apk)"
          test "$VERSION" = "${{ steps.version.outputs.version }}"

      - name: Name release APK
        shell: bash
        run: cp app/build/outputs/apk/beta/app-beta.apk "roloam-v${{ steps.version.outputs.version }}.apk"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Roloam v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: roloam-v${{ steps.version.outputs.version }}.apk
