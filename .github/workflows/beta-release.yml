name: Beta Release

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build beta APK
        run: gradle :app:assembleBeta --no-daemon

      - name: Name release APK
        run: cp app/build/outputs/apk/beta/app-beta.apk "roloam-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: roloam-${{ github.ref_name }}.apk
