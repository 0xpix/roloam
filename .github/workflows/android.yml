name: Android CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Read beta version
        id: beta_version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < BETA_VERSION)"
          BASE="${VERSION%%-beta*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100))
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build beta APK
        run: >
          gradle --init-script gradle/roloam-version.init.gradle :app:assembleBeta --no-daemon
          -ProloamVersionBase=${{ steps.beta_version.outputs.base }}
          -ProloamVersionCode=${{ steps.beta_version.outputs.code }}

      - name: Verify beta version
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          VERSION="$("$AAPT" dump badging app/build/outputs/apk/beta/app-beta.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          echo "APK version: $VERSION"
          test "$VERSION" = "${{ steps.beta_version.outputs.full }}"

      - uses: actions/upload-artifact@v4
        with:
          name: roloam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: roloam-beta-apk
          path: app/build/outputs/apk/beta/app-beta.apk
